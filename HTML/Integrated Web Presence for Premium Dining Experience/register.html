<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Same head as index.html -->
</head>

<body>
    <header class="main-header">
        <!-- Same navigation as index.html -->
    </header>

    <section class="auth-hero">
        <h1>Create an Account</h1>
        <p>Join our culinary community</p>
    </section>

    <section class="auth-container">
        <form id="registrationForm">
            <div class="form-group">
                <label for="regFirstName">First Name</label>
                <input type="text" id="regFirstName" name="firstName" required>
            </div>
            <div class="form-group">
                <label for="regLastName">Last Name</label>
                <input type="text" id="regLastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" name="email" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="regPhone">Phone Number</label>
                <input type="tel" id="regPhone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" name="password" required>
                <div class="password-requirements">
                    <p>Must be at least 8 characters</p>
                    <p>Include at least one number</p>
                    <p>Include at least one special character</p>
                </div>
            </div>
            <div class="form-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <input type="password" id="regConfirmPassword" name="confirmPassword" required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <div class="form-group">
                <input type="checkbox" id="regNewsletter" name="newsletter" checked>
                <label for="regNewsletter">Subscribe to our newsletter</label>
            </div>
            <div class="form-group">
                <input type="checkbox" id="regTerms" name="terms" required>
                <label for="regTerms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy
                        Policy</a></label>
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <div class="auth-alt">
            <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </section>

    <footer>
        <!-- Same footer as index.html -->
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
