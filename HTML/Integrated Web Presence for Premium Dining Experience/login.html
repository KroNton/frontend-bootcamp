<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Same head as index.html -->
</head>

<body>
    <header class="main-header">
        <!-- Same navigation as index.html -->
    </header>

    <section class="auth-hero">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
    </section>

    <section class="auth-container">
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" name="email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" required>
                <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
            </div>
            <div class="form-group">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <div class="auth-alt">
            <p>Don't have an account? <a href="register.html">Create one</a></p>
            <p>Or sign in with:</p>
            <div class="social-auth">
                <button class="social-btn google">Google</button>
                <button class="social-btn facebook">Facebook</button>
            </div>
        </div>
    </section>

    <footer>
        <!-- Same footer as index.html -->
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
