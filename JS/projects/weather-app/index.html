<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="weather-app">
        <header>
            <h1>Weather Forecast</h1>
            <div class="search-container">
                <input type="text" id="location-input" placeholder="Enter city name...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
                <button id="location-btn"><i class="fas fa-location-arrow"></i></button>
            </div>
        </header>

        <main>
            <section class="current-weather">
                <div class="weather-info">
                    <div class="location-date">
                        <h2 id="city-name">New York, NY</h2>
                        <p id="current-date">Monday, June 1, 2023</p>
                    </div>
                    <div class="temperature">
                        <div class="current-temp">
                            <span id="current-temp">72</span>
                            <span class="temp-unit">°F</span>
                        </div>
                        <div class="weather-condition">
                            <img id="weather-icon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Sunny">
                            <span id="weather-desc">Sunny</span>
                        </div>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <span>Wind</span>
                        <span id="wind-speed">5 mph</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <span>Humidity</span>
                        <span id="humidity">45%</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-cloud-rain"></i>
                        <span>Precipitation</span>
                        <span id="precipitation">0%</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-compress-alt"></i>
                        <span>Pressure</span>
                        <span id="pressure">1012 hPa</span>
                    </div>
                </div>
            </section>

        </main>
    </div>
    <script src="index.js"></script>
</body>

</html>
